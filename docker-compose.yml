services:
  opensearch-node1: # This is also the hostname of the container within the Docker network (i.e. https://opensearch-node1/)
    image: opensearchproject/opensearch:2.19.6 # Specifying the latest available image - modify if you want a specific version
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster # Name the cluster
      - node.name=opensearch-node1 # Name the node that will run in this container
      - discovery.seed_hosts=opensearch-node1,opensearch-node2 # Nodes to look for when discovering the cluster
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2 # Nodes eligible to serve as cluster manager
      - bootstrap.memory_lock=true # Disable JVM heap memory swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # Set min and max JVM heap sizes to at least 50% of system RAM
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=T!mberW0lf#92"
    ulimits:
      memlock:
        soft: -1 # Set memlock to unlimited (no soft or hard limit)
        hard: -1
      nofile:
        soft: 65536 # Maximum number of open files for the opensearch user - set to at least 65536
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data # Creates volume called opensearch-data1 and mounts it to the container
    ports:
      - 9200:9200 # REST API
      - 9600:9600 # Performance Analyzer
    networks:
      - opensearch-net # All of the containers will join the same Docker bridge network

  opensearch-node2:
    image: opensearchproject/opensearch:2.19.6 # This should be the same image used for opensearch-node1 to avoid issues
    container_name: opensearch-node2
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=T!mberW0lf#92"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    networks:
      - opensearch-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.6 # Make sure the version of opensearch-dashboards matches the version of opensearch installed on other nodes
    container_name: opensearch-dashboards
    ports:
      - 5601:5601 # Map host port 5601 to container port 5601
    expose:
      - "5601" # Expose port 5601 for web access to OpenSearch Dashboards
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch-node1:9200","https://opensearch-node2:9200"]' # Define the OpenSearch nodes that OpenSearch Dashboards will query
    networks:
      - opensearch-net

  opensearch-setup:
    image: curlimages/curl:8.11.1 # Tiny one-shot container to configure OpenSearch, then exit
    container_name: opensearch-setup
    depends_on:
      - opensearch-node1
    volumes:
      - ./opensearch/setup.sh:/setup.sh:ro # Waits for the cluster, then creates the template, ISM policy + data stream
      - ./opensearch/index-template.json:/opensearch/index-template.json:ro # Data-stream index template
      - ./opensearch/ism-policy.json:/opensearch/ism-policy.json:ro # 30-day retention policy for the data stream
    entrypoint: ["sh", "/setup.sh"]
    networks:
      - opensearch-net

  fluent-bit:
    image: fluent/fluent-bit:5.1 # Log processor that tails ./logs and ships parsed records to OpenSearch
    container_name: fluent-bit
    depends_on:
      opensearch-setup:
        condition: service_completed_successfully # Only start once the data stream exists
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro # Main Fluent Bit config
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro # Custom regex parser for the log format
      - ./logs:/logs:ro # Directory of *.log files to parse (read-only; Fluent Bit only tails them)
      - fluent-bit-state:/var/lib/fluent-bit # Offset-tracking DB
    networks:
      - opensearch-net

  log-generator:
    image: debian:bookworm-slim # Has bash + GNU date (needed for millisecond timestamps), used to run generate-logs.sh
    container_name: log-generator
    depends_on:
      - fluent-bit
    volumes:
      - ./generate-logs.sh:/generate-logs.sh:ro # Script that appends fake log lines to ./logs/generated.log
      - ./logs:/logs # Same directory Fluent Bit tails, so generated lines are picked up live
    entrypoint: ["bash", "/generate-logs.sh"]
    command: ["0", "1"] # Run forever, one line every second
    networks:
      - opensearch-net

volumes:
  opensearch-data1:
  opensearch-data2:
  fluent-bit-state:

networks:
  opensearch-net:
