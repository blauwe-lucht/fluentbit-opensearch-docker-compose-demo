# Custom parsers for this demo.
#
# Matches log lines of the form:
#   yyyy-mm-dd HH:MM:SS.mmm LOGLEVEL MSG
# e.g.
#   2026-08-12 14:30:42.123 INFO Service started successfully
#
# The timestamp (with millisecond precision) becomes the record time.
# Fluent Bit interprets it as UTC. To treat it as another timezone, add a
# Time_Offset line below, e.g. `Time_Offset +0200` for CEST.
[PARSER]
    Name        applog
    Format      regex
    Regex       ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) (?<level>\w+) (?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S.%L
    Time_Keep   Off
