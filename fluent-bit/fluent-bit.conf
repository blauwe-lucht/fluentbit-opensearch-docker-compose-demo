[SERVICE]
    Flush        1
    # Verbose logging so you can watch Fluent Bit's internals (file reads,
    # chunks, flush tasks, OpenSearch bulk responses) with
    # `docker compose logs -f fluent-bit`. Set back to "info" for less noise
    # (don't forget to restart fluent-bit container: docker compose restart fluent-bit).
    Log_Level    debug
    Parsers_File parsers.conf

# Tail every *.log file in the mounted ./logs directory.
[INPUT]
    Name          tail
    Path          /logs/*.log
    Parser        applog
    Tag           applog
    Refresh_Interval 5
    # Track read offsets so restarts don't re-ingest everything. Kept in its
    # own directory (a named volume) so it doesn't clutter the logs directory.
    DB            /var/lib/fluent-bit/tail.db
    # Read existing content on first start (great for the demo).
    Read_from_Head True
    # Add the path of the log from where a line was read as a separate field.
    Path_Key       source_file

# Ship parsed records to the OpenSearch cluster.
[OUTPUT]
    Name              opensearch
    Match             applog
    Host              opensearch-node1
    Port              9200
    HTTP_User         admin
    HTTP_Passwd       T!mberW0lf#92
    tls               On
    tls.verify        Off
    Index             fluentbit-logs
    Suppress_Type_Name On
    # Write into the "fluentbit-logs" data stream. Data streams only accept
    # the "create" bulk operation, so this must be set explicitly.
    Write_Operation   create
    # Use the parsed log timestamp as the document time in OpenSearch.
    Time_Key          @timestamp
    Logstash_Format   Off
